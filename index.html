<!doctype html>
<html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ESP32 — Mensagens</title>
<style>*{box-sizing:border-box}body{margin:0;background:#0c0e12;color:#f3f5f7;font:15px/1.6 system-ui,sans-serif;padding:28px 20px}header{max-width:960px;margin:auto;border-bottom:1px solid #303640;padding-bottom:22px}main{max-width:600px;margin:50px auto}h1{font-size:34px;line-height:1.2;letter-spacing:-1px}p,small{color:#a1a9b8}section{background:#171a21;border:1px solid #303640;border-radius:16px;padding:24px}label{display:block;margin:20px 0}input,textarea{display:block;width:100%;margin-top:8px;padding:15px;border:1px solid #303640;border-radius:9px;background:#101318;color:white;font:inherit;outline-color:#8eafff}textarea{height:180px;resize:vertical}button{width:100%;padding:14px;border:0;border-radius:9px;background:#8eafff;color:#101726;font:600 15px system-ui;cursor:pointer}button:disabled{opacity:.5}#status{overflow-wrap:anywhere}footer{margin-top:20px;font-size:12px;color:#929aa9}</style>
<header><b>ESP32</b> / Mensagens</header><main><small>PAINEL REMOTO</small><h1>Envie para o seu ESP32.</h1><p>Digite sua mensagem e clique em Enviar.</p><section><form id="form"><label>Sua mensagem<textarea id="message" maxlength="500" required placeholder="O que você quer enviar ao dispositivo?"></textarea><small id="count">0/500 caracteres</small></label><button id="send">Enviar</button><p id="status" role="status" aria-live="polite"></p></form></section><footer>O envio ao serviço não confirma a entrega ao dispositivo.</footer></main>
<script>
const ENDPOINT = "https://esp32s-online.nicolasplays53.workers.dev/message";
const SEND_TOKEN = "a";
const form=document.getElementById("form"),message=document.getElementById("message"),button=document.getElementById("send"),statusEl=document.getElementById("status");
message.addEventListener("input",()=>document.getElementById("count").textContent=message.value.length+"/500 caracteres");
form.addEventListener("submit",async e=>{
e.preventDefault();if(button.disabled)return;
statusEl.style.color="#ffb7b7";
if(!message.value.trim()){statusEl.textContent="Digite uma mensagem.";return}
button.disabled=true;button.textContent="Enviando…";statusEl.textContent="";
const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),15000);
try{const res=await fetch(ENDPOINT,{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+SEND_TOKEN},body:JSON.stringify({message:message.value.trim()})});
if(!res.ok)throw new Error(res.status===401?"Token inválido.":res.status===429?"Aguarde antes de enviar novamente.":"O serviço recusou o envio.");
statusEl.style.color="#a1e5c3";statusEl.textContent="Mensagem enviada!";message.value="";document.getElementById("count").textContent="0/500 caracteres";
}catch(err){statusEl.textContent=err.name==="AbortError"?"Tempo esgotado.":err.message}
finally{clearTimeout(timer);button.disabled=false;button.textContent="Enviar"}
});
</script></html>
