<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP32 - Mensagens</title>
    <style>
        body { font-family: system-ui, sans-serif; background: #0e121c; color: #f3f5f7; padding: 20px; display: flex; justify-content: center; }
        .container { max-width: 600px; width: 100%; }
        h1 { color: #fff; margin-bottom: 10px; }
        p { color: #8792A5; margin-bottom: 20px; }
        textarea { width: 100%; height: 100px; background: #0C1018; border: 1px solid #242B38; border-radius: 10px; color: #EEF3FF; padding: 14px; font-size: 16px; resize: vertical; box-sizing: border-box; }
        button { width: 100%; padding: 14px; margin-top: 10px; background: #397EF0; color: white; border: none; border-radius: 9px; font-weight: bold; cursor: pointer; font-size: 16px; }
        button:hover { background: #2b6cd6; }
        button:disabled { opacity: 0.6; cursor: not-allowed; }
        .icons-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-top: 20px; }
        .icon-btn { background: #181F2B; border: 1px solid #242B38; border-radius: 10px; padding: 10px; text-align: center; cursor: pointer; transition: 0.2s; }
        .icon-btn:hover { background: #24344E; }
        .emoji { font-size: 24px; display: block; }
        .label { font-size: 10px; color: #A6B1C4; margin-top: 4px; display: block; }
        #status { margin-top: 15px; padding: 10px; border-radius: 8px; background: #152034; font-size: 14px; text-align: center; min-height: 20px; }
        .success { background: #102B26 !important; color: #8DDCC5; }
        .error { background: #2B1010 !important; color: #ff8a8a; }
    </style>
</head>
<body>

<div class="container">
    <h1>Mensagem para Nicolas</h1>
    <p>Envie um recado ou um desenho para a tela do ESP32.</p>

    <form id="sendForm">
        <textarea id="messageInput" placeholder="Escreva aqui..." maxlength="240"></textarea>
        <button type="submit" id="sendBtn">Enviar Texto</button>
    </form>

    <div style="margin-top: 30px;">
        <h3>Ou envie um desenho:</h3>
        <div class="icons-grid" id="iconsContainer">
            <!-- Ícones gerados via JS -->
        </div>
    </div>

    <div id="status">Pronto para enviar.</div>
</div>

<script>
    // CONFIGURAÇÃO OBRIGATÓRIA
    const WORKER_URL = "https://esp32s-online.nicolasplays53.workers.dev/message";
    // ^^^^^^^^^^^^ COLOQUE A URL DO SEU WORKER AQUI ^^^^^^^^^^^^

    const icons = [
        ["ovo", "🥚"], ["coracao", "❤️"], ["estrela", "⭐"], ["caveira", "💀"], ["sol", "☀️"],
        ["lua", "🌙"], ["cafe", "☕"], ["pizza", "🍕"], ["gato", "🐱"], ["cachorro", "🐶"],
        ["fogo", "🔥"], ["raio", "⚡"], ["sorriso", "🙂"], ["joinha", "👍"], ["coracao-partido", "💔"],
        ["fantasma", "👻"], ["foguete", "🚀"], ["arvore", "🌳"], ["peixe", "🐟"], ["futebol", "⚽"]
    ];

    const form = document.getElementById('sendForm');
    const input = document.getElementById('messageInput');
    const btn = document.getElementById('sendBtn');
    const statusDiv = document.getElementById('status');
    const iconsContainer = document.getElementById('iconsContainer');

    let lastSendTime = 0;

    // Renderizar botões de ícones
    icons.forEach(([id, emoji]) => {
        const div = document.createElement('div');
        div.className = 'icon-btn';
        div.innerHTML = `<span class="emoji">${emoji}</span><span class="label">${id}</span>`;
        div.onclick = () => sendMessage(input.value || "Oi, Nicolas!", id);
        iconsContainer.appendChild(div);
    });

    async function sendMessage(text, iconId = null) {
        if (!WORKER_URL.includes("workers.dev") && !WORKER_URL.startsWith("http")) {
            alert("Configure a URL do Worker no código!");
            return;
        }

        const now = Date.now();
        if (now - lastSendTime < 5000) {
            setStatus("Aguarde 5 segundos entre envios.", "error");
            return;
        }

        btn.disabled = true;
        setStatus("Enviando...", "");

        const payload = {
            device: "esp32-nicolas",
            type: iconId ? "image" : "text",
            text: text.trim() || "Oi, Nicolas!"
        };
        
        if (iconId) payload.icon = iconId;

        try {
            const res = await fetch(WORKER_URL, {
                method: "POST",
                headers: { 
                    "Content-Type": "application/json",
                    "Authorization": "Bearer 1234"
                },
                body: JSON.stringify(payload)
            });

            const data = await res.json();

            if (res.ok && data.accepted) {
                setStatus("Mensagem enviada para a ponte! Aguardando o ESP32 ler.", "success");
                input.value = "";
                lastSendTime = now;
            } else {
                setStatus(data.error || "Erro ao enviar.", "error");
            }
        } catch (err) {
            setStatus("Falha de conexão. Verifique a internet.", "error");
            console.error(err);
        } finally {
            btn.disabled = false;
        }
    }

    function setStatus(msg, type) {
        statusDiv.textContent = msg;
        statusDiv.className = type;
    }

    form.onsubmit = (e) => {
        e.preventDefault();
        if(!input.value.trim()) return setStatus("Digite algo primeiro.", "error");
        sendMessage(input.value);
    };
</script>

</body>
</html>
